name: Automation dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: automation-dev
  cancel-in-progress: true

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync branch
        env:
          TOKEN: ${{ secrets.ACCESS_TOKEN }}
          REPOSITORY_DEV: ${{ secrets.REPOSITORY_DEV }}
        run: |
          set -e
          if [ -z "$TOKEN" ] || [ -z "$REPOSITORY_DEV" ]; then
            echo "ACCESS_TOKEN and REPOSITORY_DEV are required."
            exit 1
          fi
          TARGET="$REPOSITORY_DEV"
          TARGET="${TARGET#https://github.com/}"
          TARGET="${TARGET#http://github.com/}"
          TARGET="${TARGET%.git}"
          TARGET="${TARGET%/}"
          git remote add automation "https://x-access-token:${TOKEN}@github.com/${TARGET}.git"
          git push automation HEAD:main
